name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build PicoAmp.exe
        run: |
          VERSION=0.1.0-${GITHUB_SHA::7}
          case "$GITHUB_REF" in refs/tags/v*) VERSION=${GITHUB_REF#refs/tags/v};; esac
          make CROSS= VERSION=$VERSION
          ls -la build/PicoAmp.exe
      - name: Smoke test (the window, drawn and taken)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build\PicoAmp.exe -ArgumentList '--smoke','smoke.png' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          Get-Content smoke.png.txt
          if (-not (Test-Path smoke.png)) { throw "no screenshot" }
      - name: Smoke test (an HTTPS station through WinHTTP)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath build\PicoAmp.exe -ArgumentList '--smoke','radio.png','--play','https://ice1.somafm.com/groovesalad-128-mp3','--wait','12000' -Wait -PassThru
          Get-Content radio.png.txt
          if (-not (Select-String -Path radio.png.txt -Pattern 'state=1 .*stream=1 tls=1 buffering=0' -Quiet)) { throw "the station did not play" }
      - name: Live check (the station directory, a search, a station)
        shell: pwsh
        continue-on-error: true
        run: |
          $s = 'key Home; key Enter; key Down; key Down; key Enter; wait 8000; list; key Down; key Enter; wait 9000; status; key BS; key Down; key Down; key Down; key Enter; wait 8000; list; key /; type jazz; key Enter; wait 8000; list; quit'
          $p = Start-Process -FilePath build\PicoAmp.exe -ArgumentList '--script',"`"$s`"",'--log','live.txt' -Wait -PassThru
          Get-Content live.txt | Select-Object -First 80
      - name: Live check (clock, place, weather)
        shell: pwsh
        continue-on-error: true
        run: |
          $s = 'key C; wait 9000; page; key L; type Amsterdam; key Enter; wait 6000; key Enter; wait 6000; page; key W; wait 500; page; quit'
          $p = Start-Process -FilePath build\PicoAmp.exe -ArgumentList '--script',"`"$s`"",'--log','live2.txt' -Wait -PassThru
          Get-Content live2.txt
      - name: Live check (the news: a BBC feed, a story, its full article)
        shell: pwsh
        continue-on-error: true
        run: |
          $s = 'key T; wait 500; key Home; key Enter; wait 8000; page; key Enter; key Enter; wait 9000; page; quit'
          $p = Start-Process -FilePath build\PicoAmp.exe -ArgumentList '--script',"`"$s`"",'--log','live3.txt' -Wait -PassThru
          Get-Content live3.txt
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force PicoAmp | Out-Null
          Copy-Item build\PicoAmp.exe, README.md, LICENSE.txt PicoAmp\
          Copy-Item third_party\cbios\LICENSE PicoAmp\LICENSE-C-BIOS-font.txt
          Copy-Item third_party\miniaudio\LICENSE PicoAmp\LICENSE-miniaudio.txt
          Compress-Archive -Path PicoAmp\* -DestinationPath PicoAmp-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PicoAmp-windows-x64
          path: PicoAmp-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            smoke.png
            smoke.png.txt
            radio.png
            radio.png.txt
            live.txt
            live2.txt
            live3.txt
      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PicoAmp-windows-x64.zip

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screens
          path: build/test/*.png
